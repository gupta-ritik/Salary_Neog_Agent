services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salary-negotiation-backend
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # Keep DATABASE_URL and model/API credentials in the root .env file.
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8002
    container_name: salary-negotiation-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: salary-negotiation-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
